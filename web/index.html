<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Humanoid AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00E5FF">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03060E;
            --card-bg: #080D1A;
            --card-border: #132038;
            --cyan: #00E5FF;
            --blue: #0088FF;
            --gold: #FFB800;
            --green: #00FF88;
            --red: #FF3366;
            --text: #E6EDF3;
            --text-dim: #717D96;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 12px 18px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Main Container */
        main {
            flex: 1;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Photorealistic Face Card */
        .face-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .avatar-portal {
            width: 220px;
            height: 220px;
            position: relative;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 229, 255, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        .hologram-ring {
            position: absolute;
            width: 234px;
            height: 234px;
            border-radius: 50%;
            border: 1.5px dashed var(--cyan);
            animation: rotate-ring 12s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .state-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-top: 8px;
        }

        /* Lock Screen Mode Badge */
        .wakelock-banner {
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            margin-top: 2px;
        }

        /* Metrics Bar */
        .metrics-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 9px 12px;
        }

        .metric-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .metric-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 2px;
        }

        /* Console Output */
        .console-card {
            width: 100%;
            max-width: 400px;
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            min-height: 110px;
            max-height: 160px;
        }

        .console-header {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .console-log {
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #C9D1D9;
        }

        .log-tag {
            font-weight: bold;
        }
        .tag-jarvis { color: var(--cyan); }
        .tag-user { color: var(--gold); }
        .tag-action { color: var(--green); }

        /* Controls */
        .controls-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .cmd-input {
            flex: 1;
            background: #040710;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        .cmd-input:focus {
            border-color: var(--cyan);
        }

        .btn-send {
            background: #132038;
            border: 1px solid var(--card-border);
            color: var(--cyan);
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .voice-btn-large {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF 0%, #0077FF 100%);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div>
            <div class="brand-title">J · A · R · V · I · S</div>
            <div class="brand-sub">HUMANOID AI SYNAPSE</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>LINKED</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Photorealistic Human AI Face Card -->
        <div class="face-card">
            <div class="hologram-ring" id="holoRing"></div>
            <div class="avatar-portal" id="avatarPortal" onclick="toggleVoice()">
                <img id="imgIdle" class="avatar-img" src="/jarvis_idle.jpg" style="opacity: 1;" alt="JARVIS Idle">
                <img id="imgListen" class="avatar-img" src="/jarvis_listening.jpg" style="opacity: 0;" alt="JARVIS Listening">
                <img id="imgSpeak" class="avatar-img" src="/jarvis_speaking.jpg" style="opacity: 0;" alt="JARVIS Speaking">
                <div class="scanline-overlay"></div>
            </div>
            <div class="state-text" id="stateText">● HUMAN AI: ONLINE ●</div>
            <div class="wakelock-banner" id="wakeLockStatus">⚡ Background WakeLock Enabled</div>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">PC CPU USAGE</div>
                <div class="metric-val" id="cpuVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC RAM UTIL</div>
                <div class="metric-val" id="ramVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC POWER</div>
                <div class="metric-val" id="batVal">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">FREE STORAGE</div>
                <div class="metric-val" id="diskVal">-- GB</div>
            </div>
        </div>

        <!-- Console -->
        <div class="console-card">
            <div class="console-header">
                <span>COMMUNICATION LOG</span>
                <span onclick="clearLog()" style="cursor:pointer; color:var(--text-dim);">CLEAR</span>
            </div>
            <div class="console-log" id="consoleLog">
                <div>[SYSTEM] Photorealistic Humanoid AI Synapse Linked. Tap portrait or speak to begin.</div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls-card">
            <button class="voice-btn-large" onclick="toggleVoice()">
                <span>🎙️</span> <span id="btnText">ACTIVATE VOICE</span>
            </button>
            <div class="input-row">
                <input type="text" id="cmdInput" class="cmd-input" placeholder="Type command (e.g. 'Open VS Code', 'Play music')..." onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn-send" onclick="sendCommand()">SEND</button>
            </div>
        </div>
    </main>

    <!-- Audio Player for Neural TTS -->
    <audio id="ttsAudio" style="display: none;"></audio>

    <script>
        let isListening = false;
        let isSpeaking = false;
        let isThinking = false;
        let recognition = null;
        let wakeLock = null;

        // Enable Android Screen WakeLock (keeps phone listening & active)
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLockStatus').innerText = "⚡ Background Active / Screen WakeLock On";
                } catch (err) {
                    document.getElementById('wakeLockStatus').innerText = "🔒 Background Mode Active";
                }
            }
        }
        document.addEventListener('click', requestWakeLock, { once: true });
        requestWakeLock();

        // Setup Android Lock Screen Media Session Controls
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'J.A.R.V.I.S. Humanoid AI',
                artist: 'Stark Industries Mark VII',
                album: 'Cloud Assistant Protocol',
                artwork: [{ src: '/jarvis_idle.jpg', sizes: '512x512', type: 'image/jpeg' }]
            });

            navigator.mediaSession.setActionHandler('play', () => toggleVoice());
            navigator.mediaSession.setActionHandler('pause', () => toggleVoice());
            navigator.mediaSession.setActionHandler('nexttrack', () => executeCommand('Report system status'));
        }

        function setAIState(text, color) {
            document.getElementById('stateText').innerText = `● HUMAN AI: ${text} ●`;
            document.getElementById('stateText').style.color = color;
            document.getElementById('avatarPortal').style.borderColor = color;
            document.getElementById('avatarPortal').style.boxShadow = `0 0 28px ${color}66`;
            document.getElementById('holoRing').style.borderColor = color;
            document.getElementById('btnText').innerText = text === 'LISTENING' ? 'LISTENING...' : 'ACTIVATE VOICE';

            const imgIdle = document.getElementById('imgIdle');
            const imgListen = document.getElementById('imgListen');
            const imgSpeak = document.getElementById('imgSpeak');

            if (text === 'LISTENING') {
                imgIdle.style.opacity = '0';
                imgListen.style.opacity = '1';
                imgSpeak.style.opacity = '0';
            } else if (text === 'SPEAKING') {
                imgIdle.style.opacity = '0';
                imgListen.style.opacity = '0';
                imgSpeak.style.opacity = '1';
            } else {
                imgIdle.style.opacity = '1';
                imgListen.style.opacity = '0';
                imgSpeak.style.opacity = '0';
            }
        }

        // ==========================================
        // VOICE & COMMAND SYSTEM
        // ==========================================
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                setAIState('LISTENING', '#FFB800');
                log('VOICE', 'Listening for your command...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                log('USER', transcript);
                executeCommand(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                setAIState('ONLINE', '#00E5FF');
                log('VOICE', 'Speech error: ' + event.error);
            };

            recognition.onend = function() {
                isListening = false;
                if (document.getElementById('stateText').innerText.includes('LISTENING')) {
                    setAIState('ONLINE', '#00E5FF');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or type your command.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function log(tag, message) {
            const logBox = document.getElementById('consoleLog');
            const row = document.createElement('div');
            let tagClass = 'tag-jarvis';
            if (tag === 'USER') tagClass = 'tag-user';
            if (tag === 'ACTION') tagClass = 'tag-action';
            
            row.innerHTML = `<span class="log-tag ${tagClass}">[${tag}]</span> ${message}`;
            logBox.appendChild(row);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('consoleLog').innerHTML = '';
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            log('USER', cmd);
            executeCommand(cmd);
        }

        async function executeCommand(command) {
            isThinking = true;
            setAIState('THINKING', '#0088FF');
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                
                isThinking = false;
                if (data.action) {
                    log('ACTION', data.action);
                }
                log('JARVIS', data.reply);
                speakReply(data.reply);
            } catch (err) {
                isThinking = false;
                log('ERROR', 'Failed to communicate with PC Core: ' + err);
                setAIState('ONLINE', '#00E5FF');
            }
        }

        function speakReply(text) {
            isSpeaking = true;
            setAIState('SPEAKING', '#00FF88');
            
            const audio = document.getElementById('ttsAudio');
            audio.src = `/api/speak?text=${encodeURIComponent(text)}`;
            audio.play().then(() => {
                audio.onended = () => {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                };
            }).catch(() => {
                if ('speechSynthesis' in window) {
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.onend = () => {
                        isSpeaking = false;
                        setAIState('ONLINE', '#00E5FF');
                    };
                    window.speechSynthesis.speak(utter);
                } else {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                }
            });
        }

        // Live PC Metrics Polling
        async function updateMetrics() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('cpuVal').innerText = data.cpu_usage_percent + '%';
                document.getElementById('ramVal').innerText = data.ram_usage_percent + '%';
                document.getElementById('diskVal').innerText = data.disk_free_gb + ' GB';
                
                if (data.battery && data.battery.present) {
                    document.getElementById('batVal').innerText = data.battery.percent + '% ' + (data.battery.power_plugged ? '⚡' : '🔋');
                } else {
                    document.getElementById('batVal').innerText = 'AC Online';
                }
            } catch (e) {}
        }

        setInterval(updateMetrics, 2500);
        updateMetrics();
    </script>
</body>
</html>
