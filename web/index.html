<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Mobile</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00E5FF">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070A10;
            --card-bg: #0F1420;
            --card-border: #1B2438;
            --cyan: #00E5FF;
            --blue: #0099FF;
            --gold: #FFB300;
            --green: #00FF88;
            --red: #FF3366;
            --text: #E6EDF3;
            --text-dim: #7D8590;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .brand-sub {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Main Container */
        main {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Arc Reactor Container */
        .reactor-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .arc-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px 0;
            cursor: pointer;
        }

        .arc-svg {
            width: 100%;
            height: 100%;
            transform-origin: center;
            animation: rotate-arc 12s linear infinite;
        }

        @keyframes rotate-arc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .arc-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #FFFFFF 0%, var(--cyan) 50%, #004488 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--cyan), inset 0 0 10px #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .arc-core.listening {
            background: radial-gradient(circle, #FFFFFF 0%, var(--gold) 50%, #884400 100%);
            box-shadow: 0 0 35px var(--gold);
        }

        .arc-core.speaking {
            background: radial-gradient(circle, #FFFFFF 0%, var(--green) 50%, #006633 100%);
            box-shadow: 0 0 35px var(--green);
        }

        .state-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-top: 8px;
        }

        /* Metrics Bar */
        .metrics-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .metric-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .metric-val {
            font-size: 16px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 2px;
        }

        /* Console Output */
        .console-card {
            width: 100%;
            max-width: 400px;
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-height: 140px;
            max-height: 200px;
        }

        .console-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .console-log {
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #C9D1D9;
        }

        .log-tag {
            font-weight: bold;
        }
        .tag-jarvis { color: var(--cyan); }
        .tag-user { color: var(--gold); }
        .tag-action { color: var(--green); }

        /* Controls */
        .controls-card {
            width: 100%;
            max-width: 400px;
            padding: 10px 0 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .cmd-input {
            flex: 1;
            background: #080C14;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            color: var(--text);
            outline: none;
        }

        .cmd-input:focus {
            border-color: var(--cyan);
        }

        .btn-send {
            background: #1B2438;
            border: 1px solid var(--card-border);
            color: var(--cyan);
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .voice-btn-large {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF 0%, #0077FF 100%);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div>
            <div class="brand-title">J . A . R . V . I . S .</div>
            <div class="brand-sub">MOBILE STARK LINK</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>LINKED</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Arc Reactor -->
        <div class="reactor-card">
            <div class="arc-container" id="arcButton" onclick="toggleVoice()">
                <svg class="arc-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="#1B2438" stroke-width="3"/>
                    <circle cx="50" cy="50" r="46" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="10 8"/>
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#0099FF" stroke-width="1.5" stroke-dasharray="4 6"/>
                    <circle cx="50" cy="50" r="28" fill="#08101C" stroke="#00E5FF" stroke-width="1.5"/>
                </svg>
                <div class="arc-core" id="arcCore">
                    <span style="font-size: 24px;">🎙️</span>
                </div>
            </div>
            <div class="state-text" id="stateText">STANDBY</div>
        </div>

        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">PC CPU USAGE</div>
                <div class="metric-val" id="cpuVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC RAM UTIL</div>
                <div class="metric-val" id="ramVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC POWER</div>
                <div class="metric-val" id="batVal">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">FREE STORAGE</div>
                <div class="metric-val" id="diskVal">-- GB</div>
            </div>
        </div>

        <!-- Console -->
        <div class="console-card">
            <div class="console-header">
                <span>COMMUNICATION LOG</span>
                <span onclick="clearLog()" style="cursor:pointer; color:var(--text-dim);">CLEAR</span>
            </div>
            <div class="console-log" id="consoleLog">
                <div>[SYSTEM] Mobile link active. Tap reactor or speak to begin.</div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls-card">
            <button class="voice-btn-large" onclick="toggleVoice()">
                <span>🎙️</span> <span id="btnText">ACTIVATE VOICE</span>
            </button>
            <div class="input-row">
                <input type="text" id="cmdInput" class="cmd-input" placeholder="Type command (e.g. 'Open Chrome', 'System status')..." onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn-send" onclick="sendCommand()">SEND</button>
            </div>
        </div>
    </main>

    <!-- Audio Player for Neural TTS -->
    <audio id="ttsAudio" style="display: none;"></audio>

    <script>
        let isListening = false;
        let recognition = null;

        // Initialize Speech Recognition on Mobile
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                setReactorState('LISTENING', 'listening');
                log('VOICE', 'Listening for your command...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                log('USER', transcript);
                executeCommand(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                setReactorState('STANDBY', '');
                log('VOICE', 'Speech recognition error: ' + event.error);
            };

            recognition.onend = function() {
                isListening = false;
                if (document.getElementById('stateText').innerText === 'LISTENING') {
                    setReactorState('STANDBY', '');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or type your command.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function setReactorState(text, coreClass) {
            document.getElementById('stateText').innerText = text;
            const core = document.getElementById('arcCore');
            core.className = 'arc-core ' + coreClass;
            document.getElementById('btnText').innerText = text === 'LISTENING' ? 'LISTENING...' : 'ACTIVATE VOICE';
        }

        function log(tag, message) {
            const logBox = document.getElementById('consoleLog');
            const row = document.createElement('div');
            let tagClass = 'tag-jarvis';
            if (tag === 'USER') tagClass = 'tag-user';
            if (tag === 'ACTION') tagClass = 'tag-action';
            
            row.innerHTML = `<span class="log-tag ${tagClass}">[${tag}]</span> ${message}`;
            logBox.appendChild(row);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('consoleLog').innerHTML = '';
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            log('USER', cmd);
            executeCommand(cmd);
        }

        async function executeCommand(command) {
            setReactorState('THINKING', 'speaking');
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                
                if (data.action) {
                    log('ACTION', data.action);
                }
                log('JARVIS', data.reply);
                speakReply(data.reply);
            } catch (err) {
                log('ERROR', 'Failed to communicate with PC Core: ' + err);
                setReactorState('STANDBY', '');
            }
        }

        function speakReply(text) {
            setReactorState('SPEAKING', 'speaking');
            
            // Try fetching Edge-TTS audio stream from server
            const audio = document.getElementById('ttsAudio');
            audio.src = `/api/speak?text=${encodeURIComponent(text)}`;
            audio.play().then(() => {
                audio.onended = () => setReactorState('STANDBY', '');
            }).catch(() => {
                // Fallback to browser mobile synthesis
                if ('speechSynthesis' in window) {
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.onend = () => setReactorState('STANDBY', '');
                    window.speechSynthesis.speak(utter);
                } else {
                    setReactorState('STANDBY', '');
                }
            });
        }

        // Live PC Metrics Updater
        async function updateMetrics() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('cpuVal').innerText = data.cpu_usage_percent + '%';
                document.getElementById('ramVal').innerText = data.ram_usage_percent + '%';
                document.getElementById('diskVal').innerText = data.disk_free_gb + ' GB';
                
                if (data.battery && data.battery.present) {
                    document.getElementById('batVal').innerText = data.battery.percent + '% ' + (data.battery.power_plugged ? '⚡' : '🔋');
                } else {
                    document.getElementById('batVal').innerText = 'AC Online';
                }
            } catch (e) {}
        }

        setInterval(updateMetrics, 2500);
        updateMetrics();
    </script>
</body>
</html>
