<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Synapse AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00E5FF">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03060E;
            --card-bg: #080D1A;
            --card-border: #132038;
            --cyan: #00E5FF;
            --blue: #0088FF;
            --gold: #FFB800;
            --green: #00FF88;
            --red: #FF3366;
            --text: #E6EDF3;
            --text-dim: #717D96;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 12px 18px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Main Container */
        main {
            flex: 1;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Digital Face Card */
        .face-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .face-canvas-container {
            width: 230px;
            height: 230px;
            cursor: pointer;
        }

        .state-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-top: 4px;
        }

        /* Lock Screen Mode Badge */
        .wakelock-banner {
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            margin-top: 2px;
        }

        /* Metrics Bar */
        .metrics-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 9px 12px;
        }

        .metric-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .metric-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 2px;
        }

        /* Console Output */
        .console-card {
            width: 100%;
            max-width: 400px;
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            min-height: 110px;
            max-height: 160px;
        }

        .console-header {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .console-log {
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #C9D1D9;
        }

        .log-tag {
            font-weight: bold;
        }
        .tag-jarvis { color: var(--cyan); }
        .tag-user { color: var(--gold); }
        .tag-action { color: var(--green); }

        /* Controls */
        .controls-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .cmd-input {
            flex: 1;
            background: #040710;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        .cmd-input:focus {
            border-color: var(--cyan);
        }

        .btn-send {
            background: #132038;
            border: 1px solid var(--card-border);
            color: var(--cyan);
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .voice-btn-large {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF 0%, #0077FF 100%);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div>
            <div class="brand-title">J · A · R · V · I · S</div>
            <div class="brand-sub">REALISTIC AI SYNAPSE</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>LINKED</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Realistic Digital Face Card -->
        <div class="face-card">
            <div class="face-canvas-container" onclick="toggleVoice()">
                <canvas id="faceCanvas" width="230" height="230"></canvas>
            </div>
            <div class="state-text" id="stateText">● AI FACE: ONLINE ●</div>
            <div class="wakelock-banner" id="wakeLockStatus">⚡ Background WakeLock Enabled</div>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">PC CPU USAGE</div>
                <div class="metric-val" id="cpuVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC RAM UTIL</div>
                <div class="metric-val" id="ramVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC POWER</div>
                <div class="metric-val" id="batVal">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">FREE STORAGE</div>
                <div class="metric-val" id="diskVal">-- GB</div>
            </div>
        </div>

        <!-- Console -->
        <div class="console-card">
            <div class="console-header">
                <span>COMMUNICATION LOG</span>
                <span onclick="clearLog()" style="cursor:pointer; color:var(--text-dim);">CLEAR</span>
            </div>
            <div class="console-log" id="consoleLog">
                <div>[SYSTEM] Realistic AI Synapse Linked. Tap face or speak to begin.</div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls-card">
            <button class="voice-btn-large" onclick="toggleVoice()">
                <span>🎙️</span> <span id="btnText">ACTIVATE VOICE</span>
            </button>
            <div class="input-row">
                <input type="text" id="cmdInput" class="cmd-input" placeholder="Type command (e.g. 'Open VS Code', 'Play music')..." onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn-send" onclick="sendCommand()">SEND</button>
            </div>
        </div>
    </main>

    <!-- Audio Player for Neural TTS -->
    <audio id="ttsAudio" style="display: none;"></audio>

    <script>
        let isListening = false;
        let isSpeaking = false;
        let isThinking = false;
        let stateColor = "#00E5FF";
        let recognition = null;
        let wakeLock = null;

        // Enable Android Screen WakeLock (keeps phone listening & active)
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLockStatus').innerText = "⚡ Background Active / Screen WakeLock On";
                } catch (err) {
                    document.getElementById('wakeLockStatus').innerText = "🔒 Background Mode Active";
                }
            }
        }
        document.addEventListener('click', requestWakeLock, { once: true });
        requestWakeLock();

        // Setup Android Lock Screen Media Session Controls
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'J.A.R.V.I.S. Synapse AI',
                artist: 'Stark Industries Mark VII',
                album: 'Cloud Assistant Protocol',
                artwork: [{ src: '/manifest.json', sizes: '512x512', type: 'image/png' }]
            });

            navigator.mediaSession.setActionHandler('play', () => toggleVoice());
            navigator.mediaSession.setActionHandler('pause', () => toggleVoice());
            navigator.mediaSession.setActionHandler('nexttrack', () => sendDirectAction('Report system status'));
        }

        // ==========================================
        // REALISTIC DIGITAL FACE CANVAS RENDERER
        // ==========================================
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 115, cy = 115;
        let blinkVal = 1.0;
        let isBlinking = false;
        let lastBlink = Date.now();
        let lookX = 0, lookY = 0;
        let targetLookX = 0, targetLookY = 0;
        let lastGazeShift = Date.now();
        let mouthOpen = 0.0;
        let scanlineY = 0;

        function drawRealisticFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const now = Date.now();

            // 1. Natural Gaze Shifts
            if (now - lastGazeShift > 3000) {
                if (isThinking) {
                    targetLookX = (Math.random() > 0.5 ? 0.7 : -0.7);
                    targetLookY = -0.3;
                } else if (isListening) {
                    targetLookX = 0;
                    targetLookY = 0.1;
                } else {
                    targetLookX = (Math.random() - 0.5) * 0.7;
                    targetLookY = (Math.random() - 0.5) * 0.4;
                }
                lastGazeShift = now;
            }
            lookX += (targetLookX - lookX) * 0.15;
            lookY += (targetLookY - lookY) * 0.15;

            // 2. Smooth Natural Blinking
            if (!isBlinking && now - lastBlink > 4200) {
                isBlinking = true;
                lastBlink = now;
            }
            if (isBlinking) {
                blinkVal -= 0.3;
                if (blinkVal <= 0) {
                    blinkVal = 0;
                    isBlinking = false;
                }
            } else {
                if (blinkVal < 1.0) blinkVal += 0.25;
            }

            scanlineY = (scanlineY + 2) % 230;

            // 3. Anatomical Head Wireframe & 3D Shading
            const hw = 86, hh = 96;
            ctx.strokeStyle = stateColor;
            ctx.fillStyle = '#050A16';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(cx - hw * 0.55, cy - hh * 0.85);
            ctx.lineTo(cx, cy - hh * 0.95);
            ctx.lineTo(cx + hw * 0.55, cy - hh * 0.85);
            ctx.lineTo(cx + hw * 0.85, cy - hh * 0.35);
            ctx.lineTo(cx + hw * 0.80, cy + hh * 0.25);
            ctx.lineTo(cx + hw * 0.50, cy + hh * 0.70);
            ctx.lineTo(cx + hw * 0.22, cy + hh * 0.95);
            ctx.lineTo(cx - hw * 0.22, cy + hh * 0.95);
            ctx.lineTo(cx - hw * 0.50, cy + hh * 0.70);
            ctx.lineTo(cx - hw * 0.80, cy + hh * 0.25);
            ctx.lineTo(cx - hw * 0.85, cy - hh * 0.35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Forehead Node
            const fhy = cy - hh * 0.65;
            ctx.fillStyle = stateColor;
            ctx.beginPath();
            ctx.arc(cx, fhy, 4, 0, Math.PI * 2);
            ctx.fill();

            // 4. Realistic Eyes
            const eyeY = cy - hh * 0.18;
            const eyeSpacing = hw * 0.42;
            const eyeW = 18;
            const eyeH = 10 * Math.max(0.05, blinkVal);

            [-1, 1].forEach(side => {
                const ex = cx + (side * eyeSpacing);

                // Eyebrow Arch
                const browY = eyeY - 11;
                const tilt = isListening ? 3 : (isThinking ? -2 : 0);
                ctx.beginPath();
                ctx.moveTo(ex - eyeW * 0.7, browY + (side * tilt));
                ctx.quadraticCurveTo(ex, browY - 2 - Math.abs(tilt), ex + eyeW * 0.7, browY - (side * tilt));
                ctx.lineWidth = 2.2;
                ctx.strokeStyle = stateColor;
                ctx.stroke();

                if (eyeH > 1) {
                    // Sclera
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#02050C';
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = stateColor;
                    ctx.stroke();

                    // Iris
                    const irisR = 6;
                    const irisX = ex + (lookX * 4);
                    const irisY = eyeY + (lookY * 2.5);

                    ctx.fillStyle = stateColor;
                    ctx.beginPath();
                    ctx.ellipse(irisX, irisY, irisR, irisR * Math.max(0.2, blinkVal), 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupil
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(irisX, irisY, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Specular Light
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(irisX - 1.5, irisY - 1.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 5. Nose Bridge Highlight
            const noseTipY = cy + hh * 0.22;
            ctx.strokeStyle = '#162846';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx - 3, eyeY);
            ctx.lineTo(cx - 3, noseTipY - 3);
            ctx.moveTo(cx + 3, eyeY);
            ctx.lineTo(cx + 3, noseTipY - 3);
            ctx.stroke();

            ctx.strokeStyle = stateColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx - 5, noseTipY);
            ctx.lineTo(cx + 5, noseTipY);
            ctx.stroke();

            // 6. Realistic Articulating Lips
            const mouthY = cy + hh * 0.56;
            const mouthW = hw * 0.55;
            let targetOpen = 0.05 + Math.sin(now * 0.002) * 0.03;
            if (isSpeaking) targetOpen = 0.35 + Math.random() * 0.65;
            else if (isListening) targetOpen = 0.15 + Math.random() * 0.3;

            mouthOpen += (targetOpen - mouthOpen) * 0.4;
            const openH = mouthOpen * 12;

            // Upper Lip (Cupid's Bow)
            ctx.strokeStyle = stateColor;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cx - mouthW, mouthY);
            ctx.quadraticCurveTo(cx - mouthW * 0.4, mouthY - 3.5, cx, mouthY - 1);
            ctx.quadraticCurveTo(cx + mouthW * 0.4, mouthY - 3.5, cx + mouthW, mouthY);
            ctx.stroke();

            // Lower Lip
            ctx.beginPath();
            ctx.moveTo(cx - mouthW, mouthY);
            ctx.quadraticCurveTo(cx, mouthY + 4 + openH, cx + mouthW, mouthY);
            ctx.stroke();

            // Equalizer inside mouth cavity
            if (openH > 2) {
                for (let i = -3; i <= 3; i++) {
                    const bh = isSpeaking ? (3 + Math.random() * (openH * 0.8)) : 1.5;
                    ctx.fillRect(cx + i * 5, mouthY - bh / 2, 2.5, bh);
                }
            }

            // Scanline
            ctx.strokeStyle = stateColor;
            ctx.setLineDash([3, 5]);
            ctx.beginPath();
            ctx.moveTo(cx - hw * 0.9, scanlineY);
            ctx.lineTo(cx + hw * 0.9, scanlineY);
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(drawRealisticFace);
        }

        requestAnimationFrame(drawRealisticFace);

        // ==========================================
        // VOICE & COMMAND SYSTEM
        // ==========================================
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                setAIState('LISTENING', '#FFB800');
                log('VOICE', 'Listening for your command...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                log('USER', transcript);
                executeCommand(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                setAIState('ONLINE', '#00E5FF');
                log('VOICE', 'Speech error: ' + event.error);
            };

            recognition.onend = function() {
                isListening = false;
                if (document.getElementById('stateText').innerText.includes('LISTENING')) {
                    setAIState('ONLINE', '#00E5FF');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or type your command.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function setAIState(text, color) {
            stateColor = color;
            document.getElementById('stateText').innerText = `● AI FACE: ${text} ●`;
            document.getElementById('stateText').style.color = color;
            document.getElementById('btnText').innerText = text === 'LISTENING' ? 'LISTENING...' : 'ACTIVATE VOICE';
        }

        function log(tag, message) {
            const logBox = document.getElementById('consoleLog');
            const row = document.createElement('div');
            let tagClass = 'tag-jarvis';
            if (tag === 'USER') tagClass = 'tag-user';
            if (tag === 'ACTION') tagClass = 'tag-action';
            
            row.innerHTML = `<span class="log-tag ${tagClass}">[${tag}]</span> ${message}`;
            logBox.appendChild(row);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('consoleLog').innerHTML = '';
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            log('USER', cmd);
            executeCommand(cmd);
        }

        async function executeCommand(command) {
            isThinking = true;
            setAIState('THINKING', '#0088FF');
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                
                isThinking = false;
                if (data.action) {
                    log('ACTION', data.action);
                }
                log('JARVIS', data.reply);
                speakReply(data.reply);
            } catch (err) {
                isThinking = false;
                log('ERROR', 'Failed to communicate with PC Core: ' + err);
                setAIState('ONLINE', '#00E5FF');
            }
        }

        function speakReply(text) {
            isSpeaking = true;
            setAIState('SPEAKING', '#00FF88');
            
            const audio = document.getElementById('ttsAudio');
            audio.src = `/api/speak?text=${encodeURIComponent(text)}`;
            audio.play().then(() => {
                audio.onended = () => {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                };
            }).catch(() => {
                if ('speechSynthesis' in window) {
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.onend = () => {
                        isSpeaking = false;
                        setAIState('ONLINE', '#00E5FF');
                    };
                    window.speechSynthesis.speak(utter);
                } else {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                }
            });
        }

        // Live PC Metrics Polling
        async function updateMetrics() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('cpuVal').innerText = data.cpu_usage_percent + '%';
                document.getElementById('ramVal').innerText = data.ram_usage_percent + '%';
                document.getElementById('diskVal').innerText = data.disk_free_gb + ' GB';
                
                if (data.battery && data.battery.present) {
                    document.getElementById('batVal').innerText = data.battery.percent + '% ' + (data.battery.power_plugged ? '⚡' : '🔋');
                } else {
                    document.getElementById('batVal').innerText = 'AC Online';
                }
            } catch (e) {}
        }

        setInterval(updateMetrics, 2500);
        updateMetrics();
    </script>
</body>
</html>
