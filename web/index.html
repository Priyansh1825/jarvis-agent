<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Mobile AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00E5FF">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050811;
            --card-bg: #0A0F1D;
            --card-border: #16233B;
            --cyan: #00E5FF;
            --blue: #0088FF;
            --gold: #FFB800;
            --green: #00FF88;
            --red: #FF3366;
            --text: #E6EDF3;
            --text-dim: #717D96;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 14px 18px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Main Container */
        main {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Digital Face Card */
        .face-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .face-canvas-container {
            width: 220px;
            height: 220px;
            cursor: pointer;
        }

        .state-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-top: 4px;
        }

        /* Metrics Bar */
        .metrics-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .metric-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .metric-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 2px;
        }

        /* Console Output */
        .console-card {
            width: 100%;
            max-width: 400px;
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 120px;
            max-height: 180px;
        }

        .console-header {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .console-log {
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #C9D1D9;
        }

        .log-tag {
            font-weight: bold;
        }
        .tag-jarvis { color: var(--cyan); }
        .tag-user { color: var(--gold); }
        .tag-action { color: var(--green); }

        /* Controls */
        .controls-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .cmd-input {
            flex: 1;
            background: #060A14;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        .cmd-input:focus {
            border-color: var(--cyan);
        }

        .btn-send {
            background: #16233B;
            border: 1px solid var(--card-border);
            color: var(--cyan);
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .voice-btn-large {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF 0%, #0077FF 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div>
            <div class="brand-title">J · A · R · V · I · S</div>
            <div class="brand-sub">DIGITAL AI SYNAPSE</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Digital Face Card -->
        <div class="face-card">
            <div class="face-canvas-container" onclick="toggleVoice()">
                <canvas id="faceCanvas" width="220" height="220"></canvas>
            </div>
            <div class="state-text" id="stateText">● AI FACE: ONLINE ●</div>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">PC CPU USAGE</div>
                <div class="metric-val" id="cpuVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC RAM UTIL</div>
                <div class="metric-val" id="ramVal">--%</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PC POWER</div>
                <div class="metric-val" id="batVal">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">FREE STORAGE</div>
                <div class="metric-val" id="diskVal">-- GB</div>
            </div>
        </div>

        <!-- Console -->
        <div class="console-card">
            <div class="console-header">
                <span>COMMUNICATION LOG</span>
                <span onclick="clearLog()" style="cursor:pointer; color:var(--text-dim);">CLEAR</span>
            </div>
            <div class="console-log" id="consoleLog">
                <div>[SYSTEM] Digital AI Synapse Linked. Tap face or speak to begin.</div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls-card">
            <button class="voice-btn-large" onclick="toggleVoice()">
                <span>🎙️</span> <span id="btnText">ACTIVATE VOICE</span>
            </button>
            <div class="input-row">
                <input type="text" id="cmdInput" class="cmd-input" placeholder="Type command (e.g. 'Open VS Code', 'Play music')..." onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn-send" onclick="sendCommand()">SEND</button>
            </div>
        </div>
    </main>

    <!-- Audio Player for Neural TTS -->
    <audio id="ttsAudio" style="display: none;"></audio>

    <script>
        let isListening = false;
        let isSpeaking = false;
        let isThinking = false;
        let stateColor = "#00E5FF";
        let recognition = null;

        // Digital Face Canvas Drawing
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 110, cy = 110;
        let blinkProgress = 1.0;
        let isBlinking = false;
        let lastBlink = Date.now();
        let scanlineY = 0;
        let mouthAmps = new Array(12).fill(0.1);

        function drawFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const now = Date.now();

            // Blink logic
            if (!isBlinking && now - lastBlink > 4000) {
                isBlinking = true;
                lastBlink = now;
            }
            if (isBlinking) {
                blinkProgress -= 0.25;
                if (blinkProgress <= 0) {
                    blinkProgress = 0;
                    isBlinking = false;
                }
            } else {
                if (blinkProgress < 1.0) blinkProgress += 0.25;
            }

            scanlineY = (scanlineY + 2) % 220;

            // 1. Head Wireframe Contour
            const hw = 85, hh = 92;
            ctx.strokeStyle = stateColor;
            ctx.fillStyle = '#060B16';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(cx - hw * 0.6, cy - hh * 0.8);
            ctx.lineTo(cx + hw * 0.6, cy - hh * 0.8);
            ctx.lineTo(cx + hw * 0.85, cy - hh * 0.3);
            ctx.lineTo(cx + hw * 0.75, cy + hh * 0.4);
            ctx.lineTo(cx + hw * 0.35, cy + hh * 0.85);
            ctx.lineTo(cx - hw * 0.35, cy + hh * 0.85);
            ctx.lineTo(cx - hw * 0.75, cy + hh * 0.4);
            ctx.lineTo(cx - hw * 0.85, cy - hh * 0.3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Forehead Node
            const fhy = cy - hh * 0.55;
            ctx.fillStyle = stateColor;
            ctx.beginPath();
            ctx.arc(cx, fhy, 5, 0, Math.PI * 2);
            ctx.fill();

            // 2. Eyes
            const eyeSpacing = hw * 0.38;
            const eyeY = cy - hh * 0.15;
            const eyeW = 20;
            const eyeH = 12 * Math.max(0, blinkProgress);

            [-1, 1].forEach(side => {
                const ex = cx + (side * eyeSpacing);

                // Eyebrow
                ctx.beginPath();
                ctx.moveTo(ex - eyeW * 0.6, eyeY - 10);
                ctx.lineTo(ex + eyeW * 0.6, eyeY - 10);
                ctx.lineWidth = 2;
                ctx.stroke();

                if (eyeH > 1) {
                    ctx.beginPath();
                    ctx.moveTo(ex - eyeW, eyeY);
                    ctx.lineTo(ex - eyeW * 0.5, eyeY - eyeH);
                    ctx.lineTo(ex + eyeW * 0.5, eyeY - eyeH);
                    ctx.lineTo(ex + eyeW, eyeY);
                    ctx.lineTo(ex + eyeW * 0.5, eyeY + eyeH);
                    ctx.lineTo(ex - eyeW * 0.5, eyeY + eyeH);
                    ctx.closePath();
                    ctx.fillStyle = '#040810';
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Glowing Iris
                    ctx.fillStyle = stateColor;
                    ctx.beginPath();
                    ctx.arc(ex, eyeY, Math.min(5, eyeH * 0.8), 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 3. Dynamic Mouth
            const mouthY = cy + hh * 0.52;
            const totalMouthW = hw * 0.75;
            const barW = totalMouthW / mouthAmps.length;
            const startX = cx - (totalMouthW / 2);

            ctx.fillStyle = stateColor;
            mouthAmps.forEach((val, i) => {
                let target = 0.08 + Math.sin(now * 0.003 + i * 0.5) * 0.05;
                if (isSpeaking) target = 0.3 + Math.random() * 0.7;
                else if (isListening) target = 0.15 + Math.random() * 0.45;

                mouthAmps[i] += (target - mouthAmps[i]) * 0.4;
                const barH = mouthAmps[i] * 20;
                const bx = startX + (i * barW);

                ctx.fillRect(bx + 1, mouthY - barH / 2, barW - 2, barH);
            });

            // 4. Scanline
            ctx.strokeStyle = stateColor;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(cx - hw, scanlineY);
            ctx.lineTo(cx + hw, scanlineY);
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(drawFace);
        }

        requestAnimationFrame(drawFace);

        // Initialize Speech Recognition on Mobile
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                setAIState('LISTENING', '#FFB800');
                log('VOICE', 'Listening for your command...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                log('USER', transcript);
                executeCommand(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                setAIState('ONLINE', '#00E5FF');
                log('VOICE', 'Speech error: ' + event.error);
            };

            recognition.onend = function() {
                isListening = false;
                if (document.getElementById('stateText').innerText.includes('LISTENING')) {
                    setAIState('ONLINE', '#00E5FF');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or type your command.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function setAIState(text, color) {
            stateColor = color;
            document.getElementById('stateText').innerText = `● AI FACE: ${text} ●`;
            document.getElementById('stateText').style.color = color;
            document.getElementById('btnText').innerText = text === 'LISTENING' ? 'LISTENING...' : 'ACTIVATE VOICE';
        }

        function log(tag, message) {
            const logBox = document.getElementById('consoleLog');
            const row = document.createElement('div');
            let tagClass = 'tag-jarvis';
            if (tag === 'USER') tagClass = 'tag-user';
            if (tag === 'ACTION') tagClass = 'tag-action';
            
            row.innerHTML = `<span class="log-tag ${tagClass}">[${tag}]</span> ${message}`;
            logBox.appendChild(row);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('consoleLog').innerHTML = '';
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            log('USER', cmd);
            executeCommand(cmd);
        }

        async function executeCommand(command) {
            isThinking = true;
            setAIState('THINKING', '#0088FF');
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();
                
                isThinking = false;
                if (data.action) {
                    log('ACTION', data.action);
                }
                log('JARVIS', data.reply);
                speakReply(data.reply);
            } catch (err) {
                isThinking = false;
                log('ERROR', 'Failed to communicate with PC Core: ' + err);
                setAIState('ONLINE', '#00E5FF');
            }
        }

        function speakReply(text) {
            isSpeaking = true;
            setAIState('SPEAKING', '#00FF88');
            
            const audio = document.getElementById('ttsAudio');
            audio.src = `/api/speak?text=${encodeURIComponent(text)}`;
            audio.play().then(() => {
                audio.onended = () => {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                };
            }).catch(() => {
                if ('speechSynthesis' in window) {
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.onend = () => {
                        isSpeaking = false;
                        setAIState('ONLINE', '#00E5FF');
                    };
                    window.speechSynthesis.speak(utter);
                } else {
                    isSpeaking = false;
                    setAIState('ONLINE', '#00E5FF');
                }
            });
        }

        // Live PC Metrics Updater
        async function updateMetrics() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('cpuVal').innerText = data.cpu_usage_percent + '%';
                document.getElementById('ramVal').innerText = data.ram_usage_percent + '%';
                document.getElementById('diskVal').innerText = data.disk_free_gb + ' GB';
                
                if (data.battery && data.battery.present) {
                    document.getElementById('batVal').innerText = data.battery.percent + '% ' + (data.battery.power_plugged ? '⚡' : '🔋');
                } else {
                    document.getElementById('batVal').innerText = 'AC Online';
                }
            } catch (e) {}
        }

        setInterval(updateMetrics, 2500);
        updateMetrics();
    </script>
</body>
</html>
